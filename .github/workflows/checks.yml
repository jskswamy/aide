name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.x"

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/pre-commit
          key: lint-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.golangci.yml', 'go.sum') }}

      # Direct run instead of pre-commit/action: its latest release still
      # calls actions/cache@v4 (Node 20) internally, which trips the runner's
      # Node.js 20 deprecation notice.
      - run: pipx install pre-commit

      - run: SKIP=no-commit-to-branch pre-commit run --all-files

  test:
    name: Test (Linux)
    uses: ./.github/workflows/_test.yml
    with:
      runner: ubuntu-26.04
      coverage: true

  test-macos:
    name: Test (macOS)
    uses: ./.github/workflows/_test.yml
    with:
      runner: macos-15
      coverage: false

  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - run: make build

  sandbox-integration:
    name: Sandbox Integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
          - os: ubuntu-22.04
            runner: ubuntu-22.04
    uses: ./.github/workflows/_test.yml
    with:
      runner: ${{ matrix.runner }}
      integration: true

  gosec:
    name: Security Scan (gosec)
    uses: ./.github/workflows/_gosec.yml

  # main only takes fast-forward pushes of commits that already ran CI, so
  # each commit keeps its author's signature (GitHub's rebase merge drops it).
  rebased:
    name: Rebased on main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      # The default checkout is GitHub's test merge commit, shallow and
      # without origin/main; check the PR's own head with full history.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - run: |
          git merge-base --is-ancestor origin/main HEAD \
            || { echo "::error::Branch is behind main. Run: git fetch origin && git rebase origin/main && git push --force-with-lease"; exit 1; }
          test -z "$(git rev-list --merges origin/main..HEAD)" \
            || { echo "::error::Branch has merge commits. Rebase onto main instead of merging it in."; exit 1; }
