name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test (Linux)
    uses: ./.github/workflows/_test.yml
    with:
      runner: ubuntu-latest
      coverage: false

  test-macos:
    name: Test (macOS)
    uses: ./.github/workflows/_test.yml
    with:
      runner: macos-15
      coverage: false

  gosec:
    name: Security Scan (gosec)
    uses: ./.github/workflows/_gosec.yml

  govulncheck:
    name: Vulnerability Check
    uses: ./.github/workflows/_govulncheck.yml

  goreleaser:
    name: Release
    needs: [test, test-macos, gosec, govulncheck]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
