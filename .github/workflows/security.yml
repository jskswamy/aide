name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"  # Sunday 00:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  gosec:
    name: Security Scan (gosec)
    uses: ./.github/workflows/_gosec.yml

  govulncheck:
    name: Vulnerability Check
    uses: ./.github/workflows/_govulncheck.yml

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@v3.37.5
        with:
          languages: go

      - run: make build

      - uses: github/codeql-action/analyze@v3.37.5
