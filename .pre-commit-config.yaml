repos:
  # Built-in hooks — fast, zero-config hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  # Documentation slop detector
  - repo: local
    hooks:
      - id: doc-slop-check
        name: check docs for slop words
        entry: scripts/check-doc-slop.sh
        language: script
        types: [markdown]
        pass_filenames: false

  # Go linting — language: system uses the nix-provided golangci-lint binary
  # so the Go version always matches the project toolchain. CI installs
  # golangci-lint via the golangci-lint-action (see .github/workflows/ci.yml).
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
        language: system
        args: [./...]

  # Go build verification
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-build

  # Secret detection (pre-push only)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
        stages: [pre-push]

  # Go tests (pre-push only — too slow for every commit)
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-unit-tests
        stages: [pre-push]
